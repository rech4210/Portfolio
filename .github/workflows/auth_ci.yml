name: AuthModule CI

on:
  push:
    branches: [ "main", "KMS/Feature/Server" ]
    paths:
      - 'AuthModule/**'
  pull_request:
    branches: [ "main", "KMS/Feature/Server" ]
    paths:
      - 'AuthModule/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: AuthModule/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./AuthModule

    - name: Run tests
      run: npm test
      working-directory: ./AuthModule
      env:
        CI: true
        JWT_SECRET: test-secret-key

