services:
  db:
    image: mysql:8.0
    container_name: mygame_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_#123
      MYSQL_DATABASE: mygamedb
      MYSQL_USER: gameuser
      MYSQL_PASSWORD: gamepassword
    ports:
      - "3306:3306"
    volumes:
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
